<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gi&#7887; H&#224;ng - HOA SAC</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Noise -->
    <div class="noise-overlay"></div>
    <div class="custom-cursor"></div>

    <!-- HEADER (SYNCED) -->
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">HOA SAC.</a>
            <div class="hamburger-menu"><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="men.html" class="nav-link">Nam</a></li>
                    <li class="nav-item"><a href="women.html" class="nav-link">N&#7919;</a></li>
                    <li class="nav-item"><a href="collections.html" class="nav-link">B&#7897; S&#432;u T&#7853;p</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Stories</a></li>
                    <li class="nav-item"><a href="contact.html" class="nav-link">Li&#234;n H&#7879;</a></li>
                    <li class="nav-item"><a href="about.html" class="nav-link">V&#7873; Hoa S&#7855;c</a></li>
                </ul>
            </nav>
            <div class="header-actions"><a href="cart.html" class="cart-btn">Gi&#7887; h&#224;ng (0)</a></div>
        </div>
    </header>

    <main class="cart-page">
        <h1 class="page-title">Your Shopping Bag</h1>
        
        <div class="cart-container">
            <!-- LEFT: ITEM LIST -->
            <div class="cart-items" id="cart-items-container">
                <!-- Items injected by JS -->
                <p class="empty-msg">Gi&#7887; h&#224;ng &#273;ang tr&#7889;ng.</p>
            </div>

            <!-- RIGHT: SUMMARY -->
            <div class="cart-summary">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>T&#7841;m t&#237;nh</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>V&#7853;n chuy&#7875;n</span>
                    <span>Mi&#7877;n ph&#237;</span>
                </div>
                <div class="summary-total">
                    <span>T&#7893;ng c&#7897;ng</span>
                    <span id="total">$0.00</span>
                </div>
                <button class="checkout-btn">Thanh To&#225;n (Checkout)</button>
                <a href="women.html" class="continue-link">Ti&#7871;p t&#7909;c mua s&#7855;m</a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col brand-col"><h3 class="footer-logo">HOA SAC.</h3></div>
        </div>
    </footer>

    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/lang.js"></script>
    <script src="js/auth-state.js"></script>
    <script src="js/cart.js"></script>
    <script src="main.js"></script>
    
    <script>
        // LOGIC HI&#7874;N TH&#7882; GI&#7886; H&#192;NG RI&#202;NG
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('cart-items-container');
            const subtotalEl = document.getElementById('subtotal');
            const totalEl = document.getElementById('total');
            
            let cart = JSON.parse(localStorage.getItem('hoasac_cart')) || [];

            function renderCart() {
                if (cart.length === 0) {
                    container.innerHTML = '<p class="empty-msg">Gi&#7887; h&#224;ng &#273;ang tr&#7889;ng.</p>';
                    subtotalEl.innerText = "$0.00";
                    totalEl.innerText = "$0.00";
                    return;
                }

                container.innerHTML = '';
                let total = 0;

                cart.forEach((item, index) => {
                    total += item.price * item.quantity;
                    
                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.innerHTML = `
                        <div class="cart-img">
                            <img src="${item.image}" alt="${item.name}" onerror="this.src='assets/images/placeholder.svg'">
                        </div>
                        <div class="cart-details">
                            <h4>${item.name}</h4>
                            <p>Size: ${item.size}</p>
                            <span class="cart-price">$${item.price}</span>
                            <div class="qty-control">
                                <button onclick="updateQty(${index}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQty(${index}, 1)">+</button>
                            </div>
                        </div>
                        <span class="remove-item" onclick="removeItem(${index})">&times;</span>
                    `;
                    container.appendChild(div);
                });

                const formattedTotal = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(total);
                subtotalEl.innerText = formattedTotal;
                totalEl.innerText = formattedTotal;
            }

            window.updateQty = function(index, change) {
                cart[index].quantity += change;
                if (cart[index].quantity < 1) cart[index].quantity = 1;
                localStorage.setItem('hoasac_cart', JSON.stringify(cart));
                renderCart();
                // G&#7885;i l&#7841;i h&#224;m global trong main.js &#273;&#7875; update header badge
                if(window.location.reload) window.location.reload(); 
            }

            window.removeItem = function(index) {
                cart.splice(index, 1);
                localStorage.setItem('hoasac_cart', JSON.stringify(cart));
                renderCart();
                window.location.reload();
            }

            renderCart();
        });
    </script>
</body>
</html>
